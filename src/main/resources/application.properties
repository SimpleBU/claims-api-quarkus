quarkus.application.name=claims-api-quarkus
quarkus.http.port=8080

# The JAX-RS root is declared in code by @ApplicationPath("/api") on ClaimsApplication,
# so quarkus.rest.path is intentionally left at its default.

quarkus.http.limits.max-body-size=20M
quarkus.log.level=INFO
quarkus.log.category."com.example.claims".level=DEBUG

claims.payout.approval-threshold=500000
claims.integration.bank-callback-secret=local-dev-secret
